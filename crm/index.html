<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap');
:root{
  --blue:#1C5D99; 
  --blue-md:#2A7BCA;
  --blue-lt:#E6F0FA;
  --blue-xlt:#F2F7FC;
  --green:#1A7A4A;--green-lt:#E8F5EE;
  --orange:#C55A11;--orange-lt:#FEF4EC;
  --purple:#6A1B9A;--purple-lt:#F3E5F5;
  --red:#c53030;
  --gray:#595959;--gray-lt:#F7F7F5;--border:#E2E8F0;--white:#FFFFFF;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(28,93,153,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F0F4FA;color:#1a1a2e;min-height:100vh; transition: background 0.3s, color 0.3s;}

header{background:var(--blue);padding:0 1.5rem;height:65px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.15);position:sticky;top:0;z-index:100; transition: background 0.3s;}
.logo{display:flex;align-items:center;gap:12px}
.logo-img {width:38px; height:38px; object-fit: contain;}
.logo-text-group {display:flex; flex-direction:column; gap:1px;}
.logo-text{font-size:17px;font-weight:600;color:rgba(255,255,255,.98); line-height: 1.1;}
.logo-sub{font-size:11px;color:rgba(255,255,255,.65);font-weight:300;}

.header-right {display:flex;align-items:center;gap:14px;}
.btn-action{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:6px 14px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer; transition: background 0.2s; text-decoration: none;}
.btn-action:hover{background:rgba(255,255,255,0.25)}

.btn-icon {
    padding: 0;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    border: none;
    color: white;
    cursor: pointer;
    transition: background 0.2s;
}
.btn-icon:hover { background: rgba(255,255,255,0.1); }

.tabs-bar{background:var(--white);border-bottom:2px solid var(--border);display:flex;padding:0 1.5rem;position:sticky;top:65px;z-index:90; transition: background 0.3s, border-color 0.3s;}
.tab-btn{padding:12px 22px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--gray);background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;transition:color .15s,border-color .15s}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tab-btn:hover:not(.active){color:var(--blue-md)}
.tab-pane{display:none}
.tab-pane.active{display:block}

main{max-width:1320px;margin:0 auto;padding:1.2rem 1.2rem 4rem}

.kpis5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:1.2rem}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:.9rem 1.1rem;box-shadow:var(--shadow); transition: background 0.3s, border-color 0.3s;}
.kpi-label{font-size:10px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.kpi-value{font-size:24px;font-weight:600;color:var(--blue);line-height:1}
.kpi-value.green{color:var(--green)}
.kpi-value.purple{color:var(--purple)}
.kpi-sub{font-size:10px;color:#aaa;margin-top:3px}

.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:1.2rem}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;box-shadow:var(--shadow); transition: background 0.3s, border-color 0.3s;}
.card-title{font-size:12px;font-weight:600;color:var(--blue);margin-bottom:.8rem;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';display:block;width:3px;height:13px;background:var(--blue-md);border-radius:2px}
.chart-box{position:relative;height:175px}

.table-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow); transition: background 0.3s, border-color 0.3s;}
.table-toolbar{padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px; transition: border-color 0.3s;}
.toolbar-left { display: flex; align-items: center; gap: 15px; flex-wrap: wrap;}
.search-box { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; width: 200px; transition: border-color 0.2s; background:var(--white); color:inherit;}
.sort-box { padding: 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background-color: var(--white); cursor: pointer; outline: none; transition: border-color 0.2s;}

.btn-primary{padding:7px 15px;border:none;border-radius:7px;background:var(--blue);color:#fff;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px; transition: background 0.2s;}
.btn-primary.small {font-size: 10px; padding: 5px 10px; border-radius: 5px; background: var(--blue-md);}
.btn-danger{padding:7px 15px;border:none;border-radius:7px;background:var(--red);color:#fff;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;align-items:center;gap:5px;display:none}
.btn-danger.vis{display:inline-flex}

table{width:100%;border-collapse:collapse;background:var(--white);font-size:12px;}
thead tr{background:var(--blue); transition: background 0.3s;}
thead th{padding:9px 11px;text-align:left;font-size:10px;font-weight:600;color:rgba(255,255,255,0.9);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap; cursor: pointer;}
tbody tr{border-bottom:1px solid var(--border);transition:background 0.1s;}
tbody tr:hover{background:var(--blue-xlt)}
tbody tr.sel{background:#fff0f0 !important}
td{padding:8px 11px;color:#2a2a3e;vertical-align:middle}
td.nc{font-weight:600;color:var(--blue)}

.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.bg{background:var(--green-lt);color:var(--green)}
.bo{background:var(--orange-lt);color:var(--orange)}
.bb{background:var(--blue-lt);color:var(--blue)}
.bgy{background:#F0F0EE;color:#666}
.bp{background:var(--purple-lt);color:var(--purple)}

.overlay{position:fixed;inset:0;background:rgba(10,20,50,0.6);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.modal{background:var(--white);border-radius:16px;width:min(520px,95vw);max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,0.25);animation:up 0.2s ease;}
.modal-header{padding:1.1rem 1.4rem 0.85rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-size:14px;font-weight:600;color:var(--blue)}
.modal-close{background:none;border:none;font-size:20px;color:#aaa;cursor:pointer;padding:2px 6px;}
.modal-body{padding:1.1rem 1.4rem}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrp{display:flex;flex-direction:column;gap:5px}
.fgrp label{font-size:10px;font-weight:600;color:var(--gray);text-transform:uppercase;}
.fgrp input,.fgrp select{height:36px;border:1.5px solid var(--border);border-radius:7px;padding:0 10px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--white);color:inherit;}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--green);color:#fff;padding:10px 18px;border-radius:9px;font-size:12px;font-weight:500;opacity:0;transform:translateY(8px);transition:0.2s;z-index:600;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* DARK MODE STYLES */
body.dark-mode { background: #0f172a; color: #f1f5f9; }
body.dark-mode header { background: #0f172a; border-bottom: 1px solid #1e293b; box-shadow: none; }
body.dark-mode .logo-text { color: #f8fafc; }
body.dark-mode .tabs-bar { background: #1e293b; border-bottom: 2px solid #334155; }
body.dark-mode .tab-btn { color: #94a3b8; }
body.dark-mode .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
body.dark-mode .kpi, body.dark-mode .card, body.dark-mode .table-card, body.dark-mode .modal { background: #1e293b; border-color: #334155; }
body.dark-mode .kpi-label, body.dark-mode .kpi-sub { color: #94a3b8; }
body.dark-mode .kpi-value { color: #e2e8f0; }
body.dark-mode .kpi-value.green { color: #4ade80; }
body.dark-mode .kpi-value.purple { color: #c084fc; }
body.dark-mode .card-title { color: #f8fafc; }
body.dark-mode .card-title::before { background: #38bdf8; }
body.dark-mode table { background: #1e293b; }
body.dark-mode thead tr { background: #334155; }
body.dark-mode thead th { color: #cbd5e1; }
body.dark-mode thead th:hover { background-color: #475569; }
body.dark-mode tbody tr { border-bottom-color: #334155; }
body.dark-mode tbody tr:hover { background: #0f172a; }
body.dark-mode tbody tr.sel{background:#3b0707 !important}
body.dark-mode td { color: #cbd5e1; }
body.dark-mode td.nc { color: #38bdf8; }
body.dark-mode .table-toolbar, body.dark-mode .modal-header { border-bottom-color: #334155; }
body.dark-mode .modal-title { color: #f8fafc; }
body.dark-mode .fgrp label { color: #cbd5e1; }
body.dark-mode .fgrp input, body.dark-mode .fgrp select, body.dark-mode .search-box, body.dark-mode .sort-box { background: #0f172a; color: #f8fafc; border-color: #475569; }
body.dark-mode .modal-close:hover { background: #334155; color: #fff;}

@media(max-width:960px){
  .kpis5{grid-template-columns:repeat(2,1fr)}
  .grid5{grid-template-columns:repeat(2,1fr)}
  .fg{grid-template-columns:1fr}
}
</style>
</head>

  </div>

<div class="tabs-bar">
  <button class="tab-btn active" id="tab-btn-p" onclick="switchTab('p')">📊 Plataforma</button>

<main>
  </main>

<script>
// --- NOVO CÓDIGO DE PREFERÊNCIA DE TEMA ---
(function() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
    }
})();

window.addEventListener('DOMContentLoaded', () => {
    const isDark = document.body.classList.contains('dark-mode');
    const icon = document.getElementById('theme-icon');
    if (icon) icon.textContent = isDark ? 'light_mode' : 'dark_mode';
});

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    
    // Salva no Navegador
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    
    // Altera o Ícone
    const icon = document.getElementById('theme-icon');
    if (icon) icon.textContent = isDark ? 'light_mode' : 'dark_mode';

    // Atualiza Gráficos se existirem
    if (typeof charts !== 'undefined') {
        Object.values(charts).forEach(function(c){
            if(c.config.type === 'pie') {
                c.data.datasets[0].borderColor = isDark ? '#1e293b' : '#fff';
                c.options.plugins.legend.labels.color = isDark ? '#cbd5e1' : '#666';
            } else if (c.config.type === 'bar') {
                c.options.scales.x.ticks.color = isDark ? '#94a3b8' : '#666';
                c.options.scales.y.ticks.color = isDark ? '#94a3b8' : '#666';
                c.options.scales.y.grid.color = isDark ? '#334155' : '#F0F0EE';
            }
            c.update();
        });
    }
}
// --- FIM DO CÓDIGO DE TEMA ---

var dbData = {}; 
var charts = {};

// Sincronização Firebase (Mantenha o seu código de rows original)
var fbRef = null;
try { fbRef = fbDB.ref('crm/rows'); } catch(e) { console.warn('Firebase não disponível:', e); }

if (fbRef) {
  fbRef.on('value', function(snap) {
    dbData = snap.val() || {}; 
    // refresh(); // Chame suas funções de refresh aqui
    setSyncStatus('ok');
  });
}

function setSyncStatus(s) {
  var el = document.getElementById('syncInfo');
  if (!el) return;
  if (s==='ok')      el.textContent = '🟢 sincronizado';
  if (s==='saving')  el.textContent = '🟡 salvando...';
  if (s==='err')     el.textContent = '🔴 erro ao salvar';
}

function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('tab-btn-'+t).classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
  setTimeout(function(){ Object.values(charts).forEach(function(c){ c.resize(); }); }, 60);
}

// ... Restante das suas funções (getRows, refresh, exportExcel, etc)
</script>
