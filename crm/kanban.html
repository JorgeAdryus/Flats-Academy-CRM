<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flats Academy — Funil Kanban Pro</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:"AIzaSyAlTgm4_nJGjvu_Fm6kSmmonOpOSByEKHY",
    authDomain:"crm-flats-academy.firebaseapp.com",
    databaseURL:"https://crm-flats-academy-default-rtdb.firebaseio.com",
    projectId:"crm-flats-academy",
    storageBucket:"crm-flats-academy.firebasestorage.app",
    messagingSenderId:"722877971663",
    appId:"1:722877971663:web:d594d0c6c1d1a00ad58bba"
  });
  var fbDB = firebase.database();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');
:root {
  --blue: #1C5D99; --blue-md: #2A7BCA; --blue-lt: #E6F0FA; 
  --white: #FFFFFF; --border: #E2E8F0;
  --green: #1A7A4A; --red: #c53030; --orange: #C55A11; --purple: #6A1B9A;
  --gray: #595959; --gray-lt: #F7F7F5;
  --bg-ganho: #dcfce7; --bg-perdido: #fee2e2; --bg-atrasado: #f3e8ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #F0F4FA; color: #1a1a2e; min-height: 100vh; }

header { background: var(--blue); padding: 0 1.5rem; height: 65px; display: flex; align-items: center; justify-content: space-between; color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-img { width: 38px; height: 38px; object-fit: contain; }

/* Botão padrão do site principal */
.btn-action {
  display: flex; align-items: center; justify-content: center; gap: 6px; 
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); 
  color: #fff; padding: 6px 14px; border-radius: 7px; font-size: 12px; 
  font-weight: 500; cursor: pointer; text-decoration: none; transition: background 0.2s;
}
.btn-action:hover { background: rgba(255,255,255,0.25); }

main { padding: 1.5rem; max-width: 1800px; margin: 0 auto; }
.kanban-board { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; align-items: flex-start; }
.kanban-col { background: #e2e8f0; border-radius: 12px; width: 320px; min-width: 320px; padding: 12px; min-height: 80vh; }
.kanban-col-header { font-weight: 700; font-size: 14px; color: var(--blue); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

.kanban-card { background: var(--white); border-radius: 10px; padding: 15px; margin-bottom: 12px; cursor: grab; box-shadow: 0 2px 5px rgba(0,0,0,0.06); position: relative; border: 1px solid transparent; transition: transform 0.2s; }
.kanban-card.status-GANHO { background: var(--bg-ganho); border-color: #86efac; }
.kanban-card.status-PERDIDO { background: var(--bg-perdido); border-color: #fca5a5; }
.kanban-card.atrasado { background: var(--bg-atrasado) !important; border-color: #d8b4fe; }

.k-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
.k-btn { font-size: 18px; cursor: pointer; color: #94a3b8; }
.k-btn:hover { color: var(--blue); }
.btn-up { color: var(--purple) !important; font-weight: bold; }

.kanban-card h4 { font-size: 15px; margin-bottom: 5px; color: var(--blue); }
.kanban-card p { font-size: 12px; color: var(--gray); margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }

.therm-icon { font-size: 20px; font-variation-settings: 'FILL' 1; }

/* Modal e Abas */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
.overlay.open { display: flex; }
.modal { background: #fff; border-radius: 16px; width: min(600px, 95vw); padding: 25px; max-height: 90vh; overflow-y: auto; }
.modal-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; gap: 15px; }
.m-tab { padding: 10px 5px; font-size: 12px; cursor: pointer; color: var(--gray); border-bottom: 3px solid transparent; font-weight: 600; text-transform: uppercase; }
.m-tab.active { color: var(--blue); border-color: var(--blue); }

.fgrp { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
.fgrp label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--gray); }
.fgrp input, .fgrp select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; }

.timeline-box { background: var(--gray-lt); padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--blue); position: relative; }
.time-stamp { font-size: 10px; color: #94a3b8; font-weight: 600; margin-bottom: 5px; }
.btn-primary { background: var(--blue); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
.btn-danger { background: #fee2e2; color: #c53030; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }

</style>
</head>
<body>

<header>
  <div class="logo-area">
    <img src="logo.png" class="logo-img" onerror="this.style.display='none'">
    <div style="display:flex; flex-direction:column;">
        <span style="font-weight:600; font-size:17px;">Flats Academy</span>
        <span style="font-size:11px; opacity:0.7;">Funil Comercial</span>
    </div>
  </div>
  <a href="index.html" class="btn-action">
    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
    Voltar ao Site Principal
  </a>
</header>

<main>
  <div style="margin-bottom:25px; display:flex; justify-content:space-between; align-items:center;">
    <h2 style="font-size:20px; font-weight:700;">Fluxo de Oportunidades</h2>
    <button class="btn-primary" onclick="openModal()">+ Adicionar Oportunidade</button>
  </div>
  <div class="kanban-board" id="kanban-board"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-tabs">
      <div class="m-tab active" id="mt-dados" onclick="switchTab('dados')">Cadastro</div>
      <div class="m-tab" id="mt-notas" onclick="switchTab('notas')">Timeline</div>
    </div>

    <input type="hidden" id="f-id">

    <div id="pane-dados">
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
        <div class="fgrp"><label>Nome</label><input type="text" id="f-nome"></div>
        <div class="fgrp"><label>Sobrenome</label><input type="text" id="f-sobrenome"></div>
      </div>
      <div class="fgrp"><label>Telefone</label><input type="text" id="f-tel"></div>
      <div class="fgrp"><label>Origem</label>
        <select id="f-origem">
            <option value="ADS">ADS</option><option value="Instagram">Instagram</option>
            <option value="WhatsApp">WhatsApp</option><option value="Indicação Interna">Indicação Interna</option>
            <option value="Indicação Externa">Indicação Externa</option>
        </select>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
          <div class="fgrp"><label>Produto</label>
            <select id="f-produto">
                <option value="Downsell">Downsell</option><option value="Flats Academy">Flats Academy</option>
                <option value="Flats Academy VIT">Flats Academy VIT</option><option value="Webinário">Webinário</option>
                <option value="Flats Academy Web">Flats Academy Web</option>
            </select>
          </div>
          <div class="fgrp"><label>Expectativa (Mês)</label>
            <select id="f-expectativa">
                <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option>
                <option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option>
                <option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option>
                <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
            </select>
          </div>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
          <div class="fgrp"><label>Status Final</label>
            <select id="f-status-final">
                <option value="NORMAL">Normal (Em aberto)</option>
                <option value="GANHO">GANHO (Verde)</option>
                <option value="PERDIDO">PERDIDO (Vermelha)</option>
            </select>
          </div>
          <div class="fgrp">
            <label>Temperatura: <span id="temp-val">0</span></label>
            <input type="range" id="f-temp" min="0" max="80" step="10" oninput="document.getElementById('temp-val').innerText=this.value">
          </div>
      </div>
      <div class="fgrp"><label>Documentação (Link/Print)</label><input type="text" id="f-anexo" placeholder="Link de Notas Fiscais ou Prints"></div>
    </div>

    <div id="pane-notas" style="display:none">
        <div class="fgrp">
            <label>Nova Anotação</label>
            <div style="display:flex; gap:8px"><input type="text" id="f-note-input" style="flex:1"><button class="btn-primary" onclick="addNote()">Salvar</button></div>
        </div>
        <div id="notes-list"></div>
    </div>

    <div style="margin-top:25px; display:flex; justify-content:space-between; padding-top:15px; border-top:1px solid #eee;">
      <button class="btn-danger" id="btn-del" style="display:none" onclick="deleteOpp()">Excluir Oportunidade</button>
      <button class="btn-primary" onclick="saveOpp()">Salvar Alterações</button>
    </div>
  </div>
</div>

<script>
let dbData = {};
const COLS = ["Primeiro Contato", "Proposta", "Negociação", "Stand By"];
const MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

fbDB.ref('crm/kanban_v2').on('value', snap => {
    dbData = snap.val() || {};
    renderKanban();
});

function renderKanban() {
    const board = document.getElementById('kanban-board');
    const now = new Date();
    const curMonth = now.getMonth() + 1;

    board.innerHTML = COLS.map(col => {
        const items = Object.keys(dbData).filter(id => (dbData[id].status || "Primeiro Contato") === col);
        return `
        <div class="kanban-col" ondragover="event.preventDefault()" ondrop="drop(event, '${col}')">
            <div class="kanban-col-header">${col} <span>${items.length}</span></div>
            ${items.map(id => {
                const o = dbData[id];
                const isAtrasado = (parseInt(o.expectativa) < curMonth) && o.statusFinal === 'NORMAL';
                const temp = parseInt(o.temp) || 0;
                const tempColor = `color-mix(in srgb, #ef4444 ${temp/0.8}%, #1C5D99)`;
                
                return `
                <div class="kanban-card status-${o.statusFinal} ${isAtrasado ? 'atrasado' : ''}" draggable="true" ondragstart="drag(event, '${id}')">
                    <div class="k-tools">
                        ${isAtrasado ? `<span class="material-symbols-outlined k-btn btn-up" onclick="updateExp('${id}')">upgrade</span>` : ''}
                        <span class="material-symbols-outlined k-btn" onclick="editOpp('${id}')">edit</span>
                    </div>
                    <h4>${o.nome} ${o.sobrenome}</h4>
                    <p><span class="material-symbols-outlined" style="font-size:14px">call</span> ${o.tel || '---'}</p>
                    <p><span class="material-symbols-outlined" style="font-size:14px">calendar_today</span> Exp: ${MONTHS[o.expectativa-1]}</p>
                    <div style="display:flex; align-items:center; gap:5px; margin-top:8px;">
                        <span class="material-symbols-outlined therm-icon" style="color:${tempColor}">thermometer</span>
                        <span style="font-size:10px; font-weight:700;">${temp}º</span>
                        ${o.anexo ? `<span class="material-symbols-outlined" style="font-size:14px; margin-left:auto; color:var(--blue)">attach_file</span>` : ''}
                    </div>
                </div>`;
            }).join('')}
        </div>`;
    }).join('');
}

function saveOpp() {
    const id = document.getElementById('f-id').value || 'k_' + Date.now();
    const nome = document.getElementById('f-nome').value;
    if(!nome) return alert("Por favor, insira o nome.");

    dbData[id] = {
        ...dbData[id],
        nome: nome,
        sobrenome: document.getElementById('f-sobrenome').value,
        tel: document.getElementById('f-tel').value,
        origem: document.getElementById('f-origem').value,
        produto: document.getElementById('f-produto').value,
        expectativa: document.getElementById('f-expectativa').value,
        statusFinal: document.getElementById('f-status-final').value,
        temp: document.getElementById('f-temp').value,
        anexo: document.getElementById('f-anexo').value,
        status: dbData[id]?.status || "Primeiro Contato"
    };
    fbDB.ref('crm/kanban_v2').set(dbData);
    closeModal();
}

function editOpp(id) {
    const o = dbData[id];
    document.getElementById('f-id').value = id;
    document.getElementById('f-nome').value = o.nome;
    document.getElementById('f-sobrenome').value = o.sobrenome;
    document.getElementById('f-tel').value = o.tel;
    document.getElementById('f-origem').value = o.origem;
    document.getElementById('f-produto').value = o.produto;
    document.getElementById('f-expectativa').value = o.expectativa;
    document.getElementById('f-status-final').value = o.statusFinal;
    document.getElementById('f-temp').value = o.temp;
    document.getElementById('temp-val').innerText = o.temp;
    document.getElementById('f-anexo').value = o.anexo || '';
    document.getElementById('btn-del').style.display = 'block';
    renderNotes(id);
    switchTab('dados');
    document.getElementById('overlay').classList.add('open');
}

function addNote() {
    const id = document.getElementById('f-id').value;
    const text = document.getElementById('f-note-input').value;
    if(!text) return;
    if(!dbData[id].notes) dbData[id].notes = [];
    dbData[id].notes.unshift({ text, time: new Date().toLocaleString('pt-BR'), nid: Date.now() });
    fbDB.ref('crm/kanban_v2').set(dbData);
    document.getElementById('f-note-input').value = ''; renderNotes(id);
}

function renderNotes(id) {
    const list = document.getElementById('notes-list');
    list.innerHTML = (dbData[id].notes || []).map(n => `
        <div class="timeline-box">
            <div class="time-stamp">${n.time}</div>
            <div>${n.text}</div>
            <span class="material-symbols-outlined" style="position:absolute; top:8px; right:8px; font-size:16px; cursor:pointer; color:#aaa;" onclick="deleteNote('${id}', ${n.nid})">delete</span>
        </div>`).join('');
}

function deleteNote(oid, nid) {
    dbData[oid].notes = dbData[oid].notes.filter(x => x.nid !== nid);
    fbDB.ref('crm/kanban_v2').set(dbData); renderNotes(oid);
}

function updateExp(id) {
    dbData[id].expectativa = new Date().getMonth() + 1;
    fbDB.ref('crm/kanban_v2').set(dbData);
}

function drag(ev, id) { ev.dataTransfer.setData("id", id); }
function drop(ev, status) {
    ev.preventDefault();
    const id = ev.dataTransfer.getData("id");
    dbData[id].status = status;
    fbDB.ref('crm/kanban_v2').set(dbData);
}

function switchTab(t) {
    document.getElementById('pane-dados').style.display = t === 'dados' ? 'block' : 'none';
    document.getElementById('pane-notes').style.display = t === 'notas' ? 'block' : 'none';
    document.getElementById('mt-dados').classList.toggle('active', t === 'dados');
    document.getElementById('mt-notas').classList.toggle('active', t === 'notas');
}

function openModal() { 
    document.getElementById('f-id').value = '';
    document.getElementById('btn-del').style.display = 'none';
    document.getElementById('overlay').classList.add('open'); 
}

function closeModal() { 
    document.getElementById('overlay').classList.remove('open'); 
    document.querySelectorAll('.modal input').forEach(i => i.value = '');
    document.getElementById('notes-list').innerHTML = '';
}

function deleteOpp() {
    if(confirm("Deseja excluir esta oportunidade permanentemente?")) {
        delete dbData[document.getElementById('f-id').value];
        fbDB.ref('crm/kanban_v2').set(dbData);
        closeModal();
    }
}
</script>
</body>
</html>
