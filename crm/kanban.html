<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flats Academy — Funil Kanban Pro</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:"AIzaSyAlTgm4_nJGjvu_Fm6kSmmonOpOSByEKHY",
    authDomain:"crm-flats-academy.firebaseapp.com",
    databaseURL:"https://crm-flats-academy-default-rtdb.firebaseio.com",
    projectId:"crm-flats-academy",
    storageBucket:"crm-flats-academy.firebasestorage.app",
    messagingSenderId:"722877971663",
    appId:"1:722877971663:web:d594d0c6c1d1a00ad58bba"
  });
  var fbDB = firebase.database();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');
:root {
  --blue: #1C5D99; --blue-md: #2A7BCA; --orange: #C55A11; 
  --white: #FFFFFF; --border: #E2E8F0;
  --green: #1A7A4A; --red: #c53030; --purple: #6A1B9A;
  --gray: #595959; --gray-lt: #F7F7F5;
  --bg-ganho: #dcfce7; --bg-perdido: #fee2e2; --bg-atrasado: #f3e8ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #F0F4FA; color: #1a1a2e; min-height: 100vh; transition: background 0.3s, color 0.3s; }

header { background: var(--blue); padding: 0 1.5rem; height: 65px; display: flex; align-items: center; justify-content: space-between; color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); position: sticky; top:0; z-index:100;}
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-img { width: 38px; height: 38px; object-fit: contain; }

.header-right { display: flex; align-items: center; gap: 14px; }
.btn-action-main {
  display: flex; align-items: center; justify-content: center; gap: 6px; 
  background: var(--orange); border: 1px solid rgba(255,255,255,0.1); 
  color: #fff; padding: 6px 14px; border-radius: 7px; font-size: 12px; 
  font-weight: 600; cursor: pointer; text-decoration: none; transition: background 0.2s;
}
.btn-action-main:hover { background: #9c470d; }

.btn-icon {
    padding: 0; border-radius: 50%; width: 40px; height: 40px; 
    display: flex; justify-content: center; align-items: center; 
    background: transparent; border: none; color: white; cursor: pointer; 
    transition: background 0.2s;
}
.btn-icon:hover { background: rgba(255,255,255,0.1); }

main { padding: 1.5rem; max-width: 1850px; margin: 0 auto; }
.kanban-board { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; align-items: flex-start; }
.kanban-col { background: #e2e8f0; border-radius: 12px; width: 320px; min-width: 320px; padding: 12px; min-height: 80vh; transition: background 0.3s, border-color 0.3s; }
.kanban-col-header { font-weight: 700; font-size: 14px; color: var(--blue); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }

.kanban-card { background: var(--white); border-radius: 10px; padding: 15px; margin-bottom: 12px; cursor: grab; box-shadow: 0 2px 5px rgba(0,0,0,0.06); position: relative; border: 1px solid transparent; transition: background 0.3s, border-color 0.3s; }
.kanban-card.status-GANHO { background: var(--bg-ganho); border-color: #86efac; }
.kanban-card.status-PERDIDO { background: var(--bg-perdido); border-color: #fca5a5; }
.kanban-card.atrasado { background: var(--bg-atrasado) !important; border-color: #d8b4fe; }

.k-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
.k-btn { font-size: 18px; cursor: pointer; color: #94a3b8; }
.k-btn:hover { color: var(--blue); }
.btn-up { color: var(--purple) !important; font-weight: bold; }

.kanban-card h4 { font-size: 15px; margin-bottom: 5px; color: var(--blue); }
.kanban-card p { font-size: 11px; color: var(--gray); margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }

.therm-container { position: relative; width: 24px; height: 40px; background: #ddd; border-radius: 12px; border: 2px solid #bbb; overflow: hidden; margin-top: 5px; }
.therm-fill { position: absolute; bottom: 0; width: 100%; transition: height 0.4s, background 0.4s; }

/* Modal e Sub-Abas */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(2px); }
.overlay.open { display: flex; }
.modal { background: #fff; border-radius: 16px; width: min(650px, 95vw); padding: 25px; max-height: 90vh; overflow-y: auto; transition: background 0.3s; }
.modal-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; gap: 10px; overflow-x: auto; }
.m-tab { padding: 10px 12px; font-size: 11px; cursor: pointer; color: var(--gray); border-bottom: 3px solid transparent; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
.m-tab.active { color: var(--blue); border-color: var(--blue); }

.fgrp { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
.fgrp label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--gray); }
.fgrp input, .fgrp select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; transition: background 0.3s, border-color 0.3s, color 0.3s; }

.item-list-box { background: var(--gray-lt); padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--blue); position: relative; transition: background 0.3s; }
.btn-primary { background: var(--blue); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
.btn-danger { background: #fee2e2; color: var(--red); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }

/* DARK MODE STYLES (Igual ao site principal) */
body.dark-mode { background: #0f172a; color: #f1f5f9; }
body.dark-mode header { background: #0f172a; border-bottom: 1px solid #1e293b; box-shadow: none; }
body.dark-mode .kanban-col, body.dark-mode .modal { background: #1e293b; border-color: #334155; }
body.dark-mode .kanban-card { background: #0f172a; border-color: #334155; }
body.dark-mode .kanban-card.status-GANHO { background: #064e3b !important; }
body.dark-mode .kanban-card.status-PERDIDO { background: #7f1d1d !important; }
body.dark-mode .kanban-card.atrasado { background: #4c1d95 !important; }
body.dark-mode .kanban-card h4, body.dark-mode .kanban-col-header { color: #f8fafc; }
body.dark-mode .item-list-box { background: #0f172a; color: #cbd5e1; border-color: #334155; }
body.dark-mode .fgrp input, body.dark-mode .fgrp select { background: #0f172a; color: #f8fafc; border-color: #475569; }
body.dark-mode .modal-tabs { border-color: #334155; }
body.dark-mode .m-tab.active { color: #38bdf8; border-color: #38bdf8; }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <img src="logo.png" class="logo-img" onerror="this.style.display='none'">
    <div style="display:flex; flex-direction:column">
        <span style="font-weight:700; font-size:18px;">Flats Academy</span>
        <span style="font-size:10px; opacity:0.8; text-transform:uppercase;">CRM Pro Kanban</span>
    </div>
  </div>
  <div class="header-right">
    <a href="index.html" class="btn-action-main">
      <span class="material-symbols-outlined">arrow_back</span> Voltar ao Site Principal
    </a>
    <button id="dark-mode-btn" class="btn-icon" onclick="toggleDarkMode()" title="Alternar Modo Escuro">
        <span class="material-symbols-outlined" id="theme-icon">dark_mode</span>
    </button>
  </div>
</header>

<main>
  <div style="margin-bottom:25px; display:flex; justify-content:space-between; align-items:center;">
    <h2 style="font-size:22px; font-weight:700;">Gestão de Oportunidades</h2>
    <button class="btn-primary" onclick="openModal()"><span class="material-symbols-outlined">add</span> Nova Oportunidade</button>
  </div>
  <div class="kanban-board" id="kanban-board"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-tabs">
      <div class="m-tab active" id="mt-dados" onclick="switchModalTab('dados')">Cadastro</div>
      <div class="m-tab" id="mt-tasks" onclick="switchModalTab('tasks')">Atividades</div>
      <div class="m-tab" id="mt-docs" onclick="switchModalTab('docs')">Documentos</div>
      <div class="m-tab" id="mt-notas" onclick="switchModalTab('notas')">Timeline</div>
    </div>

    <input type="hidden" id="f-id">

    <div id="pane-dados">
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
        <div class="fgrp"><label>Nome</label><input type="text" id="f-nome"></div>
        <div class="fgrp"><label>Sobrenome</label><input type="text" id="f-sobrenome"></div>
      </div>
      <div class="fgrp"><label>Telefone</label><input type="text" id="f-tel"></div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
        <div class="fgrp"><label>Expectativa</label>
          <select id="f-expectativa">
            <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option><option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option><option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
          </select>
        </div>
        <div class="fgrp">
          <label>Engajamento: <span id="temp-val">0</span>º</label>
          <input type="range" id="f-temp" min="0" max="80" step="10" oninput="document.getElementById('temp-val').innerText=this.value">
        </div>
      </div>
      <div class="fgrp"><label>Status Final</label>
        <select id="f-status-final">
            <option value="NORMAL">Em Aberto</option><option value="GANHO">GANHO (Verde)</option><option value="PERDIDO">PERDIDO (Vermelho)</option>
        </select>
      </div>
    </div>

    <div id="pane-tasks" style="display:none">
        <div class="fgrp">
            <label>Nova Tarefa</label>
            <div style="display:flex; gap:8px">
                <input type="text" id="f-task-name" placeholder="O que fazer?" style="flex:1">
                <input type="date" id="f-task-date">
                <button class="btn-primary" onclick="addTask()">Add</button>
            </div>
        </div>
        <div id="tasks-list"></div>
    </div>

    <div id="pane-docs" style="display:none">
        <div class="fgrp">
            <label>Registrar Documento (Link ou Referência)</label>
            <div style="display:flex; gap:8px">
                <input type="text" id="f-doc-name" placeholder="Nome do documento ou link" style="flex:1">
                <button class="btn-primary" onclick="addDoc()">Salvar</button>
            </div>
        </div>
        <div id="docs-list"></div>
    </div>

    <div id="pane-notas" style="display:none">
        <div class="fgrp">
            <label>Nova Nota</label>
            <div style="display:flex; gap:8px"><input type="text" id="f-note-input" style="flex:1"><button class="btn-primary" onclick="addNote()">Salvar</button></div>
        </div>
        <div id="notes-list"></div>
    </div>

    <div style="margin-top:25px; display:flex; justify-content:space-between; padding-top:15px; border-top:1px solid #eee;">
      <button class="btn-danger" id="btn-del" onclick="deleteOpp()">Excluir</button>
      <button class="btn-primary" onclick="saveOpp()">Salvar Alterações</button>
    </div>
  </div>
</div>

<script>
let dbData = {};
const COLS = ["Primeiro Contato", "Proposta", "Negociação", "Stand By", "Fechado"];
const MONTHS = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

fbDB.ref('crm/kanban_v4').on('value', snap => {
    dbData = snap.val() || {};
    renderKanban();
});

function renderKanban() {
    const board = document.getElementById('kanban-board');
    const curMonth = new Date().getMonth() + 1;
    board.innerHTML = COLS.map(col => {
        const items = Object.keys(dbData).filter(id => (dbData[id].status || "Primeiro Contato") === col);
        return `
        <div class="kanban-col" ondragover="event.preventDefault()" ondrop="drop(event, '${col}')">
            <div class="kanban-col-header">${col} <span>${items.length}</span></div>
            ${items.map(id => {
                const o = dbData[id];
                const isAtrasado = (parseInt(o.expectativa) < curMonth) && o.statusFinal === 'NORMAL';
                const temp = parseInt(o.temp) || 0;
                const fillPct = (temp / 80) * 100;
                const tempColor = `color-mix(in srgb, #ef4444 ${fillPct}%, #1C5D99)`;
                return `
                <div class="kanban-card status-${o.statusFinal} ${isAtrasado ? 'atrasado' : ''}" draggable="true" ondragstart="drag(event, '${id}')">
                    <div class="k-tools">
                        ${isAtrasado ? `<span class="material-symbols-outlined k-btn" style="color:var(--purple)" onclick="updateExp('${id}')">upgrade</span>` : ''}
                        <span class="material-symbols-outlined k-btn" onclick="editOpp('${id}')">edit</span>
                    </div>
                    <h4>${o.nome} ${o.sobrenome}</h4>
                    <p>📞 ${o.tel || '---'}</p>
                    <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                        <div class="therm-container"><div class="therm-fill" style="height:${fillPct}%; background:${tempColor};"></div></div>
                        <span style="font-size:11px; font-weight:700;">${temp}º</span>
                        ${(o.docs || []).length > 0 ? `<span class="material-symbols-outlined" style="font-size:16px; margin-left:auto; color:var(--blue)">attach_file</span>` : ''}
                    </div>
                </div>`;
            }).join('')}
        </div>`;
    }).join('');
}

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    document.getElementById('theme-icon').textContent = isDark ? 'light_mode' : 'dark_mode';
}

function switchModalTab(t) {
    ['dados','tasks','docs','notas'].forEach(p => document.getElementById('pane-'+p).style.display = 'none');
    ['mt-dados','mt-tasks','mt-docs','mt-notas'].forEach(m => document.getElementById(m).classList.remove('active'));
    document.getElementById('pane-'+t).style.display = 'block';
    document.getElementById('mt-'+t).classList.add('active');
}

function addDoc() {
    const id = document.getElementById('f-id').value;
    const name = document.getElementById('f-doc-name').value;
    if(!name || !id) return;
    if(!dbData[id].docs) dbData[id].docs = [];
    dbData[id].docs.push({ name, date: new Date().toLocaleDateString(), docId: Date.now() });
    fbDB.ref('crm/kanban_v4').set(dbData);
    document.getElementById('f-doc-name').value = ''; renderDocs(id);
}

function renderDocs(id) {
    document.getElementById('docs-list').innerHTML = (dbData[id].docs || []).map(d => `
        <div class="item-list-box">
            <strong>📄 ${d.name}</strong>
            <span class="material-symbols-outlined" style="position:absolute; right:8px; cursor:pointer; color:#ccc" onclick="deleteDoc('${id}', ${d.docId})">delete</span>
        </div>`).join('');
}

function deleteDoc(oid, did) {
    dbData[oid].docs = dbData[oid].docs.filter(x => x.docId !== did);
    fbDB.ref('crm/kanban_v4').set(dbData); renderDocs(oid);
}

function addTask() {
    const id = document.getElementById('f-id').value;
    if(!dbData[id].tasks) dbData[id].tasks = [];
    dbData[id].tasks.push({ name: document.getElementById('f-task-name').value, date: document.getElementById('f-task-date').value, done: false, taskId: Date.now() });
    fbDB.ref('crm/kanban_v4').set(dbData); renderTasks(id);
}

function renderTasks(id) {
    document.getElementById('tasks-list').innerHTML = (dbData[id].tasks || []).map(t => `
        <div class="item-list-box" style="${t.done ? 'opacity:0.5; background:#e8f5ee' : ''}">
            <input type="checkbox" ${t.done?'checked':''} onclick="toggleTask('${id}', ${t.taskId})">
            <span style="${t.done?'text-decoration:line-through':''}">${t.name} (${t.date})</span>
        </div>`).join('');
}

function toggleTask(oid, tid) {
    const t = dbData[oid].tasks.find(x => x.taskId === tid); t.done = !t.done;
    fbDB.ref('crm/kanban_v4').set(dbData); renderTasks(oid);
}

function saveOpp() {
    const id = document.getElementById('f-id').value || 'k_' + Date.now();
    const nome = document.getElementById('f-nome').value;
    if(!nome) return alert("Insira o nome.");
    dbData[id] = { ...dbData[id], nome: nome, sobrenome: document.getElementById('f-sobrenome').value, tel: document.getElementById('f-tel').value, expectativa: document.getElementById('f-expectativa').value, statusFinal: document.getElementById('f-status-final').value, temp: document.getElementById('f-temp').value, status: dbData[id]?.status || "Primeiro Contato" };
    fbDB.ref('crm/kanban_v4').set(dbData); closeModal();
}

function editOpp(id) {
    const o = dbData[id]; document.getElementById('f-id').value = id;
    document.getElementById('f-nome').value = o.nome; document.getElementById('f-sobrenome').value = o.sobrenome;
    document.getElementById('f-tel').value = o.tel; document.getElementById('f-expectativa').value = o.expectativa;
    document.getElementById('f-status-final').value = o.statusFinal; document.getElementById('f-temp').value = o.temp;
    document.getElementById('temp-val').innerText = o.temp;
    renderTasks(id); renderDocs(id); renderNotes(id); switchModalTab('dados'); document.getElementById('overlay').classList.add('open');
}

function addNote() {
    const id = document.getElementById('f-id').value;
    if(!dbData[id].notes) dbData[id].notes = [];
    dbData[id].notes.unshift({ text: document.getElementById('f-note-input').value, time: new Date().toLocaleString(), nid: Date.now() });
    fbDB.ref('crm/kanban_v4').set(dbData); document.getElementById('f-note-input').value = ''; renderNotes(id);
}

function renderNotes(id) {
    document.getElementById('notes-list').innerHTML = (dbData[id].notes || []).map(n => `<div class="item-list-box"><strong>${n.time}</strong><br>${n.text}</div>`).join('');
}

function updateExp(id) { dbData[id].expectativa = new Date().getMonth()+1; fbDB.ref('crm/kanban_v3').set(dbData); }
function drag(ev, id) { ev.dataTransfer.setData("id", id); }
function drop(ev, s) { ev.preventDefault(); const id = ev.dataTransfer.getData("id"); dbData[id].status = s; fbDB.ref('crm/kanban_v4').set(dbData); }
function openModal() { document.getElementById('f-id').value = ''; document.getElementById('overlay').classList.add('open'); switchModalTab('dados'); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); document.querySelectorAll('input').forEach(i => i.value=''); }
function deleteOpp() { if(confirm("Excluir?")) { delete dbData[document.getElementById('f-id').value]; fbDB.ref('crm/kanban_v4').set(dbData); closeModal(); } }
</script>
</body>
</html>
